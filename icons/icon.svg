<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb1e3c" />
      <stop offset="100%" stop-color="#a50a28" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#eb1e3c" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Shield Base -->
  <path d="M 64 10 C 88 16, 102 20, 112 26 C 112 84, 88 104, 64 118 C 40 104, 16 84, 16 26 C 26 20, 40 16, 64 10 Z"
        fill="url(#shieldGrad)"
        stroke="rgba(255, 255, 255, 0.85)"
        stroke-width="3.5"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Play Triangle -->
  <polygon points="48,42 82,64 48,86" fill="#ffffff" />

  <!-- Lightning / Fast Skip Bolt -->
  <polygon points="76,36 62,58 72,58 54,92 82,56 72,56"
           fill="#ffe132"
           stroke="#222"
           stroke-width="1.2"
           stroke-linejoin="round" />
</svg>
